<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphe — WynaGraph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

  <style>
    /* ── Sidebar sélection harmonisée Workspace ── */
    .sel-relation-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      font-size: .84rem;
      color: var(--muted-foreground);
    }
    .sel-relation-header b   { color: #fff; }
    .sel-relation-arrow {
      font-size: .75rem;
      color: var(--cyan);
    }

    .sel-section-label {
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--cyan);
      margin: 14px 0 6px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding-bottom: 5px;
    }

    .sel-node-category {
      font-size: .8rem;
      color: var(--muted-foreground);
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: 10px;
    }

    .sel-props-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .sel-props-list li {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 6px;
      padding: 7px 11px;
      font-size: .85rem;
      line-height: 1.4;
      color: var(--muted-foreground);
      margin-bottom: 6px;
    }
    .sel-props-list li:last-child { margin-bottom: 0; }

    .sel-connections-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .sel-connections-list li {
      padding: .45rem 0;
      border-bottom: 1px solid var(--border);
      color: var(--muted-foreground);
      font-size: .88rem;
    }
    .sel-connections-list li:last-child { border-bottom: none; }

    .sel-empty {
      color: var(--muted-foreground);
      font-size: .88rem;
      line-height: 1.6;
    }

    /* ── Plein écran ── */
    body { overflow: hidden; }

    #graph-topbar {
      position: fixed;
      top: 57px; /* hauteur du site-header */
      left: 0; right: 0;
      height: 44px;
      background: rgba(4,32,66,0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0 1.25rem;
      z-index: 40;
    }
    #graph-topbar-info {
      display: flex;
      align-items: center;
      gap: .8rem;
      flex: 0 1 auto;
      overflow: hidden;
      min-width: 0;
    }
    #graph-topbar-title {
      font-size: .9rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #graph-topbar-stats {
      font-size: .78rem;
      color: var(--muted-foreground);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Recherche du graphe ── */
    #graph-search-wrap {
      position: relative;
      flex: 1;
      max-width: 320px;
      margin-left: auto;
    }
    #graph-search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted-foreground);
      font-size: .82rem;
      pointer-events: none;
    }
    #graph-search {
      width: 100%;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: #fff;
      font-size: .82rem;
      font-family: inherit;
      padding: 6px 30px 6px 30px;
      outline: none;
      transition: border-color .15s, background .15s;
    }
    #graph-search::placeholder { color: var(--muted-foreground); }
    #graph-search:focus {
      border-color: var(--cyan);
      background: rgba(255,255,255,.08);
    }
    #graph-search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted-foreground);
      font-size: .95rem;
      line-height: 1;
      cursor: pointer;
      padding: 3px 4px;
      display: none;
    }
    #graph-search-clear:hover { color: #fff; }
    #graph-search-wrap.has-value #graph-search-clear { display: block; }

    #graph-search-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0; right: 0;
      background: rgba(4,32,66,0.98);
      border: 1px solid var(--border);
      border-radius: 10px;
      max-height: 260px;
      overflow-y: auto;
      box-shadow: 0 10px 24px rgba(0,0,0,.4);
      display: none;
      z-index: 50;
    }
    #graph-search-wrap.show-results #graph-search-results { display: block; }
    .gs-result {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      font-size: .82rem;
      color: var(--foreground);
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .gs-result:last-child { border-bottom: none; }
    .gs-result:hover, .gs-result.active { background: rgba(66,235,226,.1); }
    .gs-result-group {
      font-size: .68rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--cyan);
      flex-shrink: 0;
    }
    .gs-result-empty {
      padding: 10px 12px;
      font-size: .8rem;
      color: var(--muted-foreground);
    }
    .gs-match-count {
      font-size: .72rem;
      color: var(--cyan);
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: .5rem;
    }
    @media (max-width: 768px) {
      #graph-topbar-info { display: none; }
      #graph-search-wrap { max-width: none; }
    }

    #fullscreen-layout {
      position: fixed;
      top: 101px; /* header 57px + topbar 44px */
      left: 0; right: 0; bottom: 0;
      display: flex;
    }
    #graph {
      flex: 1;
      height: 100%;
      background: var(--background);
    }
    #graph-sidebar {
      width: 300px;
      min-width: 300px;
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 1.2rem;
      overflow-y: auto;
      font-size: .92rem;
    }
    #graph-sidebar h3 {
      font-size: 1rem;
      margin-bottom: .8rem;
      color: var(--cyan);
    }
    #graph-sidebar .stats {
      display: flex;
      gap: 1.5rem;
      margin-top: 1rem;
      color: var(--muted-foreground);
      font-size: .88rem;
    }
    #graph-sidebar .stats strong {
      color: var(--foreground);
      display: block;
      font-size: 1.4rem;
    }
    @media (max-width: 768px) {
      #graph-sidebar { width: 240px; min-width: 240px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="nav">
      <a href="index.html" class="brand">WYNAGRAPH<span class="dot"> SPACE</span></a>
      <nav class="nav-links">
        <a href="index.html">Galerie</a>
        <a href="a-propos.html">À propos</a>
      </nav>
    </div>
  </header>

  <!-- Barre titre sous le header -->
  <div id="graph-topbar">
    <a href="javascript:history.back()" class="back-link" style="margin:0">← Retour</a>
    <div id="graph-topbar-info">
      <span id="graph-topbar-title"></span>
      <span id="graph-topbar-stats"></span>
    </div>
    <div id="graph-search-wrap">
      <span id="graph-search-icon">⌕</span>
      <input type="text" id="graph-search" placeholder="Rechercher un nœud…" autocomplete="off" />
      <button id="graph-search-clear" title="Effacer" aria-label="Effacer la recherche">✕</button>
      <div id="graph-search-results"></div>
    </div>
  </div>

  <!-- Layout plein écran -->
  <div id="fullscreen-layout">
    <div id="graph"></div>
    <aside id="graph-sidebar">
      <h3 id="side-title">Sélection</h3>
      <div id="selected">
        <p class="sel-empty">Cliquez sur un <strong style="color:#fff">nœud</strong> pour voir ses connexions,
        ou sur une <strong style="color:var(--cyan)">relation</strong> pour voir ses propriétés.</p>
      </div>
      <div class="stats" id="stats"></div>
    </aside>
  </div>

  <script src="data.js"></script>
  <script src="graph-render.js"></script>
  <script>
    // ── Helpers ──────────────────────────────────────────────────────────────
    function esc(str) {
      if (str == null) return '';
      return String(str).replace(/[&<>"']/g, m =>
        ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m])
      );
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    const params = new URLSearchParams(location.search);
    const id     = params.get("id");
    const graph  = GRAPHS.find((g) => g.id === id);
    const sel    = document.getElementById("selected");
    const title  = document.getElementById("side-title");
    const stats  = document.getElementById("stats");

    if (!graph) {
      document.getElementById('graph-topbar-title').textContent = 'Graphe introuvable';
    } else {
      document.title = `${graph.title} — WynaGraph`;
      document.getElementById('graph-topbar-title').textContent = graph.title;
      document.getElementById('graph-topbar-stats').textContent =
        `${graph.nodes.length} nœuds · ${(graph.edges || graph.relationships || []).length} liens`;

      const { network, nodes, edges, graph: graphN } = buildNetwork(
        document.getElementById("graph"),
        graph,
        { interactive: true }
      );
      // Utiliser le graphe normalisé pour les clics
      const g = graphN;

      // Stats
      stats.innerHTML = `
        <div><strong>${g.nodes.length}</strong> nœuds</div>
        <div><strong>${g.edges.length}</strong> liens</div>`;

      // ── Réinitialiser la sidebar ──────────────────────────────────────────
      function resetSidebar() {
        title.textContent = "Sélection";
        sel.innerHTML = `<p class="sel-empty">Cliquez sur un <strong style="color:#fff">nœud</strong> pour voir ses connexions,
          ou sur une <strong style="color:var(--cyan)">relation</strong> pour voir ses propriétés.</p>`;
      }

      // ── Clic sur un NŒUD ─────────────────────────────────────────────────
      function openNodePanel(nodeId) {
        const node = g.nodes.find((n) => n.id === nodeId);
        if (!node) return;

        title.textContent = node.label;

        const connections = g.edges
          .filter((e) => e.source === nodeId || e.target === nodeId)
          .map((e) => ({
            neighbor: (e.source === nodeId ? e.target : e.source),
            label: e.label || "",
          }))
          .map((c) => ({
            ...c,
            neighborLabel: (g.nodes.find((n) => n.id === c.neighbor)?.label || c.neighbor),
          }));

        const catHtml = node.group
          ? `<div class="sel-node-category">${esc(node.group)}</div>`
          : "";

        const propsHtml = (node.properties && node.properties.length)
          ? `<div class="sel-section-label">Propriétés</div>
             <ul class="sel-props-list">
               ${node.properties.map(p => `<li>${esc(p)}</li>`).join("")}
             </ul>`
          : "";

        const connHtml = connections.length
          ? `<div class="sel-section-label">Connexions (${connections.length})</div>
             <ul class="sel-connections-list">
               ${connections.map(c =>
                 `<li>${esc(c.neighborLabel)}${c.label ? `<br><span style="font-size:.78rem;color:var(--cyan)">${esc(c.label)}</span>` : ""}</li>`
               ).join("")}
             </ul>`
          : `<p class="sel-empty" style="margin-top:8px">Aucune connexion directe.</p>`;

        sel.innerHTML = catHtml + propsHtml + connHtml;
      }

      // ── Clic sur une ARÊTE ───────────────────────────────────────────────
      function openEdgePanel(edgeId) {
        const edge = edges.get(edgeId);
        if (!edge) return;

        // Retrouver les labels des nœuds source/cible
        const fromLabel = g.nodes.find(n => n.id === edge.from)?.label || edge.from;
        const toLabel   = g.nodes.find(n => n.id === edge.to  )?.label || edge.to;

        title.textContent = "Relation";

        const propsHtml = (edge.properties && edge.properties.length)
          ? `<div class="sel-section-label">Propriétés</div>
             <ul class="sel-props-list">
               ${edge.properties.map(p => `<li>${esc(p)}</li>`).join("")}
             </ul>`
          : `<p class="sel-empty" style="margin-top:10px;font-size:.82rem;">Aucune propriété définie pour cette relation.</p>`;

        sel.innerHTML = `
          <div class="sel-relation-header">
            <b>${esc(fromLabel)}</b>
            <span class="sel-relation-arrow">→</span>
            <b>${esc(toLabel)}</b>
          </div>
          ${edge.label
            ? `<div class="sel-section-label">Type de relation</div>
               <p style="font-size:.9rem;color:#fff;margin-bottom:8px;">${esc(edge.label)}</p>`
            : ""}
          ${propsHtml}
        `;
      }

      // ── Événements réseau ─────────────────────────────────────────────────
      network.on("click", (params) => {
        if (params.nodes.length > 0) {
          openNodePanel(params.nodes[0]);
        } else if (params.edges.length > 0) {
          openEdgePanel(params.edges[0]);
        } else {
          resetSidebar();
        }
      });

      // ── Recherche / filtre du graphe ────────────────────────────────────
      const searchInput  = document.getElementById("graph-search");
      const searchWrap   = document.getElementById("graph-search-wrap");
      const searchClear  = document.getElementById("graph-search-clear");
      const searchResults = document.getElementById("graph-search-results");

      function normalizeText(str) {
        return String(str || "")
          .toLowerCase()
          .normalize("NFD").replace(/[\u0300-\u036f]/g, ""); // retire les accents
      }

      const DIM_OPACITY = 0.1;
      const BASE_EDGE_COLOR = { color: "rgba(255,255,255,0.18)", highlight: "#42ebe2", hover: "#42ebe2" };

      function getMatches(query) {
        const q = normalizeText(query);
        if (!q) return null;
        return g.nodes.filter(n =>
          normalizeText(n.label).includes(q) ||
          normalizeText(n.id).includes(q) ||
          normalizeText(n.group).includes(q)
        );
      }

      function applyFilter(query) {
        const matches = getMatches(query);

        if (matches === null) {
          // Réinitialiser : tout redevient visible normalement
          nodes.update(g.nodes.map(n => ({ id: n.id, opacity: 1 })));
          edges.update(g.edges.map((e, i) => ({ id: i, color: { ...BASE_EDGE_COLOR, opacity: 1 } })));
          return;
        }

        const matchedIds = new Set(matches.map(n => n.id));

        nodes.update(g.nodes.map(n => ({
          id: n.id,
          opacity: matchedIds.has(n.id) ? 1 : DIM_OPACITY,
        })));

        edges.update(g.edges.map((e, i) => ({
          id: i,
          color: {
            ...BASE_EDGE_COLOR,
            opacity: (matchedIds.has(e.source) || matchedIds.has(e.target)) ? 1 : DIM_OPACITY * 0.6,
          },
        })));
      }

      function renderResultsList(query) {
        const matches = getMatches(query);
        if (matches === null || matches.length === 0) {
          searchResults.innerHTML = matches !== null
            ? `<div class="gs-result-empty">Aucun nœud trouvé.</div>`
            : "";
          return;
        }
        const shown = matches.slice(0, 25);
        searchResults.innerHTML = shown.map(n => `
          <div class="gs-result" data-id="${esc(n.id)}">
            <span>${esc(n.label)}</span>
            ${n.group ? `<span class="gs-result-group">${esc(n.group)}</span>` : ""}
          </div>
        `).join("") + (matches.length > shown.length
          ? `<div class="gs-result-empty">+ ${matches.length - shown.length} autres résultats…</div>`
          : "");
      }

      function focusOnNode(nodeId) {
        network.selectNodes([nodeId]);
        network.focus(nodeId, { scale: 1.3, animation: { duration: 500, easingFunction: "easeInOutQuad" } });
        openNodePanel(nodeId);
      }

      let searchDebounce = null;
      searchInput.addEventListener("input", () => {
        const val = searchInput.value;
        searchWrap.classList.toggle("has-value", val.length > 0);
        searchWrap.classList.toggle("show-results", val.length > 0);

        clearTimeout(searchDebounce);
        searchDebounce = setTimeout(() => {
          applyFilter(val);
          renderResultsList(val);
        }, 120);
      });

      searchInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const first = searchResults.querySelector(".gs-result");
          if (first) {
            focusOnNode(first.dataset.id);
            searchWrap.classList.remove("show-results");
          }
        } else if (e.key === "Escape") {
          clearSearch();
        }
      });

      searchInput.addEventListener("focus", () => {
        if (searchInput.value) searchWrap.classList.add("show-results");
      });

      searchResults.addEventListener("click", (e) => {
        const item = e.target.closest(".gs-result");
        if (!item) return;
        focusOnNode(item.dataset.id);
        searchWrap.classList.remove("show-results");
      });

      function clearSearch() {
        searchInput.value = "";
        searchWrap.classList.remove("has-value", "show-results");
        applyFilter("");
        searchResults.innerHTML = "";
        searchInput.blur();
      }
      searchClear.addEventListener("click", clearSearch);

      document.addEventListener("click", (e) => {
        if (!searchWrap.contains(e.target)) {
          searchWrap.classList.remove("show-results");
        }
      });
    }
  </script>
</body>
</html>
